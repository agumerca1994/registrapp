services:
  registrapp-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-registrapp}
      POSTGRES_USER: ${POSTGRES_USER:-registrapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - registrapp-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-registrapp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  registrapp-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-registrapp}:${POSTGRES_PASSWORD}@registrapp-db:5432/${POSTGRES_DB:-registrapp}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_CREDENTIALS_B64: ${FIREBASE_CREDENTIALS_B64}
      ESTADISTICAS_BCRA_TOKEN: ${ESTADISTICAS_BCRA_TOKEN}
      ENVIRONMENT: production
      # La app vive en dos dominios mientras dure el cambio de marca: el de APP_DOMAIN (lo que tiene cargado
      # Easypanel) y app.tood.com.ar. Se suman acá para no depender de editar la variable a mano.
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:3000},https://app.tood.com.ar,https://tood.com.ar,https://beta.tood.com.ar"
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-}
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET:-}
      # Lectura de comprobantes con IA en el bot. Vacía = el bot sigue como
      # antes (imágenes sin leer, PDFs desconocidos a la conciliación).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      WA_AI_ENABLED: ${WA_AI_ENABLED:-true}
      WA_AI_MODEL: ${WA_AI_MODEL:-claude-opus-5-5}
      WA_AI_DAILY_LIMIT: ${WA_AI_DAILY_LIMIT:-40}
      APP_DOMAIN: ${APP_DOMAIN:-}
      # Already used by the Traefik labels below; the backend needs it too, to
      # derive the OAuth issuer and the canonical /mcp resource URL.
      API_DOMAIN: ${API_DOMAIN:-}
      # Base de los links que arma el backend (invitaciones, links del bot, la página para autorizar el conector).
      # Easypanel no la define: sin este valor el backend la derivaba de APP_DOMAIN, el dominio viejo de la app.
      FRONTEND_URL: ${FRONTEND_URL:-https://app.tood.com.ar}
      INTERNAL_LOG_KEY: ${INTERNAL_LOG_KEY:-}
      # MCP connector. It does NOT need ALLOWED_ORIGINS touched: /mcp, /oauth/*
      # and /.well-known/* get their own wildcard CORS in main.py, because the
      # global middleware sends allow_credentials and a browser refuses to pair
      # that with `*`.
      MCP_ENABLED: ${MCP_ENABLED:-true}
      MCP_DCR_ENABLED: ${MCP_DCR_ENABLED:-true}
      MCP_ACCESS_TOKEN_TTL_SECONDS: ${MCP_ACCESS_TOKEN_TTL_SECONDS:-3600}
      MCP_REFRESH_TOKEN_TTL_DAYS: ${MCP_REFRESH_TOKEN_TTL_DAYS:-30}
      # Escape hatches for a client rejected by the transport's Host/Origin
      # check (421/403 on /mcp). Comma-separated, normally empty.
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-api.tood.com.ar,api.tood.com.ar:*,mcp.tood.com.ar,mcp.tood.com.ar:*}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      # Los tokens del conector que se crearon con la dirección vieja de la API siguen valiendo después de
      # pasar el conector a api.tood.com.ar: nadie tiene que reconectar.
      # El conector (issuer OAuth y recurso /mcp) se presenta en el dominio nuevo de la API.
      OAUTH_ISSUER_URL: ${OAUTH_ISSUER_URL:-https://api.tood.com.ar}
      # La dirección pública del conector. El issuer OAuth sigue en api.tood.com.ar.
      MCP_RESOURCE_URL: https://mcp.${SITE_DOMAIN:-tood.com.ar}/mcp
      MCP_LEGACY_RESOURCE_URLS: ${MCP_LEGACY_RESOURCE_URLS:-https://${API_DOMAIN}/mcp,https://api.tood.com.ar/mcp}
      # Alta pública de negocios (POST /auth/register con kind="business").
      # Apagada: el piloto se convierte con PATCH /internal/tenants/{id}/kind.
      BUSINESS_SIGNUP_ENABLED: ${BUSINESS_SIGNUP_ENABLED:-false}
      # Audios del bot. Sin depends_on a propósito: si whisper no levanta, el
      # backend tiene que arrancar igual y el bot pide que se lo escriban.
      WHISPER_URL: ${WHISPER_URL:-http://registrapp-whisper:9000}
      WA_AUDIO_ENABLED: ${WA_AUDIO_ENABLED:-true}
      WA_AUDIO_DAILY_LIMIT: ${WA_AUDIO_DAILY_LIMIT:-30}
      WA_AUDIO_MAX_SECONDS: ${WA_AUDIO_MAX_SECONDS:-120}
    restart: unless-stopped
    depends_on:
      registrapp-db:
        condition: service_healthy
    networks:
      - default
      - whisper-internal
    labels:
      - "traefik.enable=true"
      # Con dos redes, sin esto Traefik puede elegir la privada y la API da 504.
      - "traefik.docker.network=easypanel"
      - "traefik.http.routers.registrapp-api.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.registrapp-api.tls=true"
      - "traefik.http.routers.registrapp-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.registrapp-api.loadbalancer.server.port=8000"
      # El backend también en api.tood.com.ar, con router y certificado propios (si fallara, no toca al dominio viejo).
      - "traefik.http.routers.registrapp-api2.rule=Host(`api.${SITE_DOMAIN:-tood.com.ar}`)"
      - "traefik.http.routers.registrapp-api2.tls=true"
      - "traefik.http.routers.registrapp-api2.tls.certresolver=letsencrypt"
      - "traefik.http.routers.registrapp-api2.service=registrapp-api"
      # El conector en mcp.tood.com.ar: el mismo backend, con router y certificado propios.
      - "traefik.http.routers.registrapp-mcp.rule=Host(`mcp.${SITE_DOMAIN:-tood.com.ar}`)"
      - "traefik.http.routers.registrapp-mcp.tls=true"
      - "traefik.http.routers.registrapp-mcp.tls.certresolver=letsencrypt"
      - "traefik.http.routers.registrapp-mcp.service=registrapp-api"

  # Transcribe los audios del bot. Sólo en la red privada: sin salida a internet,
  # sin Traefik, y las otras apps del servidor no lo alcanzan.
  registrapp-whisper:
    build:
      context: ./whisper
    environment:
      WHISPER_THREADS: ${WHISPER_THREADS:-3}
    restart: unless-stopped
    cpus: 3
    mem_limit: 3g
    networks:
      - whisper-internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  registrapp-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: https://api.${SITE_DOMAIN:-tood.com.ar}
        NEXT_PUBLIC_MCP_URL: https://mcp.${SITE_DOMAIN:-tood.com.ar}/mcp
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: app.${SITE_DOMAIN:-tood.com.ar}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
        NEXT_PUBLIC_FIREBASE_VAPID_KEY: ${NEXT_PUBLIC_FIREBASE_VAPID_KEY}
        NEXT_PUBLIC_FEATURE_IOS_SHORTCUT: ${NEXT_PUBLIC_FEATURE_IOS_SHORTCUT:-false}
        NEXT_PUBLIC_FEATURE_RECONCILE: ${NEXT_PUBLIC_FEATURE_RECONCILE:-false}
        NEXT_PUBLIC_FEATURE_BUSINESS_SIGNUP: ${NEXT_PUBLIC_FEATURE_BUSINESS_SIGNUP:-false}
        # Árbol de dominios (ver lib/site.ts). Vacías = todo en un mismo host, como hasta ahora.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://tood.com.ar}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://app.tood.com.ar}
        NEXT_PUBLIC_APP_ALIASES: ${NEXT_PUBLIC_APP_ALIASES:-https://${APP_DOMAIN}}
    environment:
      NEXT_PUBLIC_API_URL: https://api.${SITE_DOMAIN:-tood.com.ar}
      NEXT_PUBLIC_MCP_URL: https://mcp.${SITE_DOMAIN:-tood.com.ar}/mcp
      NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: app.${SITE_DOMAIN:-tood.com.ar}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
      NEXT_PUBLIC_FIREBASE_VAPID_KEY: ${NEXT_PUBLIC_FIREBASE_VAPID_KEY}
      NEXT_PUBLIC_FEATURE_IOS_SHORTCUT: ${NEXT_PUBLIC_FEATURE_IOS_SHORTCUT:-false}
      NEXT_PUBLIC_FEATURE_RECONCILE: ${NEXT_PUBLIC_FEATURE_RECONCILE:-false}
      NEXT_PUBLIC_FEATURE_BUSINESS_SIGNUP: ${NEXT_PUBLIC_FEATURE_BUSINESS_SIGNUP:-false}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://tood.com.ar}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://app.tood.com.ar}
      NEXT_PUBLIC_APP_ALIASES: ${NEXT_PUBLIC_APP_ALIASES:-https://${APP_DOMAIN}}
    restart: unless-stopped
    depends_on:
      - registrapp-backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.registrapp-web.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.registrapp-web.tls=true"
      - "traefik.http.routers.registrapp-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.registrapp-web.loadbalancer.server.port=3000"
      # El sitio público (tood.com.ar y www) va al mismo contenedor, con un router propio: si su certificado
      # fallara, el de la app (APP_DOMAIN) no se entera. Qué ruta va a qué dominio lo decide middleware.ts
      # cuando NEXT_PUBLIC_SITE_URL y NEXT_PUBLIC_APP_URL están cargadas.
      - "traefik.http.routers.registrapp-site.rule=Host(`${SITE_DOMAIN:-tood.com.ar}`) || Host(`www.${SITE_DOMAIN:-tood.com.ar}`)"
      - "traefik.http.routers.registrapp-site.tls=true"
      - "traefik.http.routers.registrapp-site.tls.certresolver=letsencrypt"
      - "traefik.http.routers.registrapp-site.service=registrapp-web"
      # La app también en app.tood.com.ar, con router y certificado propios (si fallara, no toca a los otros dos).
      - "traefik.http.routers.registrapp-app2.rule=Host(`app.${SITE_DOMAIN:-tood.com.ar}`)"
      - "traefik.http.routers.registrapp-app2.tls=true"
      - "traefik.http.routers.registrapp-app2.tls.certresolver=letsencrypt"
      - "traefik.http.routers.registrapp-app2.service=registrapp-web"

volumes:
  registrapp-db-data:

networks:
  default:
    external: true
    name: easypanel
  whisper-internal:
    internal: true

