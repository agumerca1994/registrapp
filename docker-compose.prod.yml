services:
  registrapp-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-registrapp}
      POSTGRES_USER: ${POSTGRES_USER:-registrapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - registrapp-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-registrapp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  registrapp-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-registrapp}:${POSTGRES_PASSWORD}@registrapp-db:5432/${POSTGRES_DB:-registrapp}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_CREDENTIALS_B64: ${FIREBASE_CREDENTIALS_B64}
      ESTADISTICAS_BCRA_TOKEN: ${ESTADISTICAS_BCRA_TOKEN}
      ENVIRONMENT: production
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-}
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET:-}
      # Lectura de comprobantes con IA en el bot. Vacía = el bot sigue como
      # antes (imágenes sin leer, PDFs desconocidos a la conciliación).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      WA_AI_ENABLED: ${WA_AI_ENABLED:-true}
      WA_AI_MODEL: ${WA_AI_MODEL:-claude-opus-5-5}
      WA_AI_DAILY_LIMIT: ${WA_AI_DAILY_LIMIT:-40}
      APP_DOMAIN: ${APP_DOMAIN:-}
      # Already used by the Traefik labels below; the backend needs it too, to
      # derive the OAuth issuer and the canonical /mcp resource URL.
      API_DOMAIN: ${API_DOMAIN:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      INTERNAL_LOG_KEY: ${INTERNAL_LOG_KEY:-}
      # MCP connector. It does NOT need ALLOWED_ORIGINS touched: /mcp, /oauth/*
      # and /.well-known/* get their own wildcard CORS in main.py, because the
      # global middleware sends allow_credentials and a browser refuses to pair
      # that with `*`.
      MCP_ENABLED: ${MCP_ENABLED:-true}
      MCP_DCR_ENABLED: ${MCP_DCR_ENABLED:-true}
      MCP_ACCESS_TOKEN_TTL_SECONDS: ${MCP_ACCESS_TOKEN_TTL_SECONDS:-3600}
      MCP_REFRESH_TOKEN_TTL_DAYS: ${MCP_REFRESH_TOKEN_TTL_DAYS:-30}
      # Escape hatches for a client rejected by the transport's Host/Origin
      # check (421/403 on /mcp). Comma-separated, normally empty.
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      # Alta pública de negocios (POST /auth/register con kind="business").
      # Apagada: el piloto se convierte con PATCH /internal/tenants/{id}/kind.
      BUSINESS_SIGNUP_ENABLED: ${BUSINESS_SIGNUP_ENABLED:-false}
    restart: unless-stopped
    depends_on:
      registrapp-db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.registrapp-api.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.registrapp-api.tls=true"
      - "traefik.http.routers.registrapp-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.registrapp-api.loadbalancer.server.port=8000"

  registrapp-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
        NEXT_PUBLIC_FIREBASE_VAPID_KEY: ${NEXT_PUBLIC_FIREBASE_VAPID_KEY}
        NEXT_PUBLIC_FEATURE_IOS_SHORTCUT: ${NEXT_PUBLIC_FEATURE_IOS_SHORTCUT:-false}
        NEXT_PUBLIC_FEATURE_RECONCILE: ${NEXT_PUBLIC_FEATURE_RECONCILE:-false}
        NEXT_PUBLIC_FEATURE_BUSINESS_SIGNUP: ${NEXT_PUBLIC_FEATURE_BUSINESS_SIGNUP:-false}
        # Árbol de dominios (ver lib/site.ts). Vacías = todo en un mismo host, como hasta ahora.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
    environment:
      NEXT_PUBLIC_API_URL: https://${API_DOMAIN}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
      NEXT_PUBLIC_FIREBASE_VAPID_KEY: ${NEXT_PUBLIC_FIREBASE_VAPID_KEY}
      NEXT_PUBLIC_FEATURE_IOS_SHORTCUT: ${NEXT_PUBLIC_FEATURE_IOS_SHORTCUT:-false}
      NEXT_PUBLIC_FEATURE_RECONCILE: ${NEXT_PUBLIC_FEATURE_RECONCILE:-false}
      NEXT_PUBLIC_FEATURE_BUSINESS_SIGNUP: ${NEXT_PUBLIC_FEATURE_BUSINESS_SIGNUP:-false}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
    restart: unless-stopped
    depends_on:
      - registrapp-backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.registrapp-web.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.registrapp-web.tls=true"
      - "traefik.http.routers.registrapp-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.registrapp-web.loadbalancer.server.port=3000"
      # El sitio público (tood.com.ar y www) va al mismo contenedor, con un router propio: si su certificado
      # fallara, el de la app (APP_DOMAIN) no se entera. Qué ruta va a qué dominio lo decide middleware.ts
      # cuando NEXT_PUBLIC_SITE_URL y NEXT_PUBLIC_APP_URL están cargadas.
      - "traefik.http.routers.registrapp-site.rule=Host(`${SITE_DOMAIN:-tood.com.ar}`) || Host(`www.${SITE_DOMAIN:-tood.com.ar}`)"
      - "traefik.http.routers.registrapp-site.tls=true"
      - "traefik.http.routers.registrapp-site.tls.certresolver=letsencrypt"
      - "traefik.http.routers.registrapp-site.service=registrapp-web"

volumes:
  registrapp-db-data:

networks:
  default:
    external: true
    name: easypanel

